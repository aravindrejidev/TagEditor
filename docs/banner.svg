<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Tag Editor banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2F36"/>
      <stop offset="1" stop-color="#181B1F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2A93B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F353D"/>
      <stop offset="1" stop-color="#1D2025"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181B1F"/>
      <stop offset="1" stop-color="#262B31"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC25E"/>
      <stop offset="1" stop-color="#E8982A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F2A93B" flood-opacity="0.45"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B0C0E" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="230" fill="url(#halo)"/>

  <!-- app icon -->
  <g transform="translate(72 72) scale(0.5)" filter="url(#lift)">
    <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#plate)" stroke="#3A4049" stroke-width="3"/>
    <circle cx="256" cy="256" r="176" fill="url(#well)" stroke="#14161A" stroke-width="4"/>
    <g transform="translate(87 100) scale(13)" filter="url(#glow)">
      <path fill="url(#note)" d="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z"/>
    </g>
  </g>

  <!-- title -->
  <text x="372" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="700" fill="#E9EBEF">Tag Editor</text>
  <text x="374" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#A0A7B3">Audio tags, covers and synced lyrics, right on your phone.</text>

  <!-- pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" text-anchor="middle">
    <rect x="374" y="258" width="262" height="52" rx="16" fill="#1F2227" stroke="#14161A" stroke-width="2"/>
    <text x="505" y="291" fill="#F2A93B">MP3 · FLAC · M4A</text>
    <rect x="652" y="258" width="286" height="52" rx="16" fill="#1F2227" stroke="#14161A" stroke-width="2"/>
    <text x="795" y="291" fill="#F2A93B">LRC · ELRC · TTML</text>
    <rect x="954" y="258" width="262" height="52" rx="16" fill="#1F2227" stroke="#14161A" stroke-width="2"/>
    <text x="1085" y="291" fill="#A0A7B3">Lossless saving</text>
  </g>

  <!-- decorative tag fields -->
  <g opacity="0.9">
    <rect x="1010" y="70" width="190" height="26" rx="13" fill="#1F2227" stroke="#14161A" stroke-width="2"/>
    <circle cx="1027" cy="83" r="5" fill="#F2A93B"/>
    <rect x="1042" y="79" width="110" height="8" rx="4" fill="#3A4049"/>
    <rect x="1050" y="110" width="150" height="26" rx="13" fill="#1F2227" stroke="#14161A" stroke-width="2"/>
    <circle cx="1067" cy="123" r="5" fill="#F2A93B"/>
    <rect x="1082" y="119" width="82" height="8" rx="4" fill="#3A4049"/>
    <rect x="1010" y="150" width="190" height="26" rx="13" fill="#1F2227" stroke="#14161A" stroke-width="2"/>
    <circle cx="1027" cy="163" r="5" fill="#F2A93B"/>
    <rect x="1042" y="159" width="124" height="8" rx="4" fill="#3A4049"/>
  </g>
</svg>
